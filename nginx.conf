# Filename: nginx.conf
# Purpose: To be copied into the Docker image for the hub-slim service.

server {
    listen 80;
    server_name localhost;

    # The web root inside the container
    root /usr/share/nginx/html;

    # This location block handles all requests
    location / {
        # This is the critical line for Single-Page Applications.
        # It tells Nginx to fall back to /index.html if the requested file is not found.
        try_files $uri $uri/ /index.html;
    }
}
